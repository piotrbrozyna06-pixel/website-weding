        function renderSeats() {  
            const container = document.getElementById("seatsContainer");  
            container.innerHTML = "";  

            let tableCounters = {  
                "Stół I": { left: 0, right: 0 },  
                "Stół II": { left: 0, right: 0 },  
                "Stół III": { left: 0, right: 0 },  
                "Stół IV": { left: 0, right: 0 },  
                "Stół V": { left: 0, right: 0 }  
            };  

            let presTopCount = 0;  
            let presLeftCount = 0;  
            let presRightCount = 0;  

            const seatSize = 30;  
            const gap = 10;       
            const step = seatSize + gap; 

            const totalPresSeats = 10; 
              
            const tableIWidth = 70; 
            const tableIIWidth = 70; 
            const tableIIIWidth = 70; 
            const tableIVWidth = 70; 
            const tableVWidth = 70; 

            const gap12 = 150;  
            const gap23 = 240;  
            const gap34 = 240;  
            const gap45 = 150;  

            const localTableI = 0; 
            const localTableII = localTableI + tableIWidth + gap12; 
            const localTableIII = localTableII + tableIIWidth + gap23; 
            const localTableIV = localTableIII + tableIIIWidth + gap34; 
            const localTableV = localTableIV + tableIVWidth + gap45; 

            const totalTablesWidth = (localTableV + tableVWidth) - localTableI; 

            const roomWidth = 1700; 
            const offsetX = (roomWidth - totalTablesWidth) / 2; 

            const tableILeft = offsetX + localTableI; 
            const tableIILeft = offsetX + localTableII; 
            const tableIIILeft = offsetX + localTableIII; 
            const tableIVLeft = offsetX + localTableIV; 
            const tableVLeft = offsetX + localTableV; 

            const mainTableLeft = tableIILeft; 
            const targetRightEdge = tableIVLeft + tableIVWidth;  
            const finalMainTableWidth = targetRightEdge - mainTableLeft;  
              
            const actualPresStep = (finalMainTableWidth - seatSize) / (totalPresSeats - 1); 

            const renderedSeats = guestsData.map((g, index) => {  
                let x = 0, y = 0;  

                if (g.tableName === "Stół Prezydialny") {  
                    if (g.side === "top") {  
                        presTopCount++;  
                        x = mainTableLeft + ((presTopCount - 1) * actualPresStep);  
                        y = 35;  
                    } else if (g.side === "left") {  
                        presLeftCount++;  
                        x = mainTableLeft - 40;  
                        y = 85 + ((presLeftCount - 1) * 40);  
                    } else if (g.side === "right") {  
                        presRightCount++;  
                        x = mainTableLeft + finalMainTableWidth + 10;  
                        y = 85 + ((presRightCount - 1) * 40);  
                    }  
                } else {  
                    let tableLeft = tableILeft;  
                    let startY = 195;  

                    if (g.tableName === "Stół I") { tableLeft = tableILeft; startY = 195; }  
                    if (g.tableName === "Stół II") { tableLeft = tableIILeft; startY = 200; }  
                    if (g.tableName === "Stół III") { tableLeft = tableIIILeft; startY = 200; }  
                    if (g.tableName === "Stół IV") { tableLeft = tableIVLeft; startY = 200; }  
                    if (g.tableName === "Stół V") { tableLeft = tableVLeft; startY = 195; }  

                    if (g.side === "left") {  
                        tableCounters[g.tableName].left++;  
                        const idx = tableCounters[g.tableName].left;  
                        x = tableLeft - 40;  
                        y = startY + ((idx - 1) * step);  
                    } else {  
                        tableCounters[g.tableName].right++;  
                        const idx = tableCounters[g.tableName].right;  
                        x = tableLeft + 110;  
                        y = startY + ((idx - 1) * step);  
                    }  
                }  

                return { ...g, seatIndex: index + 1, x, y }; 
            }); 

            const mainTableElem = document.getElementById("mainTable"); 
            if (mainTableElem) { 
                mainTableElem.style.left = `${mainTableLeft}px`; 
                mainTableElem.style.width = `${finalMainTableWidth}px`; 
            } 

            let tableLimits = { 
                "Stół I": { top: 159, left: tableILeft, maxY: 0 }, 
                "Stół II": { top: 164, left: tableIILeft, maxY: 0 }, 
                "Stół III": { top: 164, left: tableIIILeft, maxY: 0 },  
                "Stół IV": { top: 164, left: tableIVLeft, maxY: 0 },  
                "Stół V": { top: 159, left: tableVLeft, maxY: 0 } 
            }; 

            renderedSeats.forEach(g => { 
                if (g.tableName !== "Stół Prezydialny") { 
                    if (g.y > tableLimits[g.tableName].maxY) { 
                        tableLimits[g.tableName].maxY = g.y; 
                    } 
                } 
            }); 

            for (let tName in tableLimits) { 
                let elId = ""; 
                if (tName === "Stół I") elId = "tableI"; 
                if (tName === "Stół II") elId = "tableII"; 
                if (tName === "Stół III") elId = "tableIII"; 
                if (tName === "Stół IV") elId = "tableIV"; 
                if (tName === "Stół V") elId = "tableV"; 

                const tElem = document.getElementById(elId); 
                if (tElem) { 
                    tElem.style.top = `${tableLimits[tName].top}px`; 
                    tElem.style.left = `${tableLimits[tName].left}px`; 
                    const tableHeight = (tableLimits[tName].maxY + seatSize + gap) - tableLimits[tName].top; 
                    tElem.style.height = `${tableHeight}px`; 
                } 
            } 

            renderedSeats.forEach(g => { 
                const seat = document.createElement("div");  
                seat.className = "seat";  
                seat.dataset.id = g.id;  
                seat.dataset.name = g.name;  
                seat.innerText = g.seatIndex;  
                seat.onclick = () => selectSeat(g.id);  

                seat.style.left = `${g.x}px`;  
                seat.style.top = `${g.y}px`;  
                container.appendChild(seat);  
            });  
        }  

        // Wyśrodkowanie widoku mobilnego na środkowym Stole III
        function centerOnMobile() {
            const tableIII = document.getElementById("tableIII");
            if (tableIII) {
                tableIII.scrollIntoView({ block: "start", inline: "center" });
            }
        }

        function toggleMenu() {  
            document.getElementById("searchDropdown").classList.toggle("show");  
            if(document.getElementById("searchDropdown").classList.contains("show")) {  
                document.getElementById("searchInput").focus();  
            }  
        }  

        window.onclick = function(event) {  
            if (!event.target.matches('.menu-btn') && !event.target.closest('.dropdown-content')) {  
                var dropdowns = document.getElementsByClassName("dropdown-content");  
                for (var i = 0; i < dropdowns.length; i++) {  
                    var openDropdown = dropdowns[i];  
                    if (openDropdown.classList.contains('show')) {  
                        openDropdown.classList.remove('show');  
                    }  
                }  
            }  
        }  

        function filterGuests() {  
            const input = document.getElementById("searchInput").value.toLowerCase();  
            const listContainer = document.getElementById("suggestionsList");  
            listContainer.innerHTML = "";  

            if (input.trim() === "") return;  

            const filtered = guestsData.filter(g => g.name.toLowerCase().includes(input));  

            filtered.forEach(guest => {  
                const li = document.createElement("li");  
                li.textContent = `${guest.name} (${guest.tableName})`;  
                li.onclick = function() {  
                    document.getElementById("searchInput").value = guest.name;  
                    highlightSeat(guest.id);  
                    listContainer.innerHTML = "";  
                    document.getElementById("searchDropdown").classList.remove('show');  
                };  
                listContainer.appendChild(li);  
            });  
        }  

        function highlightSeat(id) {  
            const seats = document.querySelectorAll('.seat');  
            seats.forEach(s => s.classList.remove('highlight'));  

            const targetSeat = document.querySelector(`.seat[data-id="${id}"]`);  
            if (targetSeat) {  
                targetSeat.classList.add('highlight');  
                targetSeat.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });  
                  
                setTimeout(() => {  
                    targetSeat.classList.remove('highlight');  
                }, 4000);  
            }  
        }  

        function selectSeat(id) {  
            highlightSeat(id);  
        }  

        window.onload = function() {
            renderSeats();
            setTimeout(centerOnMobile, 100);
        };
    </script>
