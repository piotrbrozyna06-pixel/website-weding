<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=3400, initial-scale=0.1, maximum-scale=5.0, user-scalable=yes">
    <title>Monika i Kuba - Plan Stołów</title>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #dcd4c7;
            --text-color: #1a1a1a;
            --accent-green: #4b6b54;
            --seat-color: #B76E79;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
        }

        .page-wrapper {
            position: relative;
            width: 3400px; 
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 200px;
        }

        header {
            text-align: center;
            margin-top: 30px;
            margin-bottom: 0px;
            width: 100%;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3.5rem;
            font-weight: 400;
            margin: 0;
            letter-spacing: 3px;
            line-height: 1.1;
            text-transform: uppercase;
        }

        h1 span {
            font-style: italic;
            font-size: 2.6rem;
            display: inline-block;
            margin: 0 15px;
            text-transform: lowercase;
        }

        .subtitle {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 4px;
            color: #4a4a4a;
            margin-top: 10px;
            margin-bottom: 0px;
        }

        .menu-container {
            position: absolute;
            z-index: 1000;
            transform: translateX(-50%);
        }

        .menu-btn {
            background-color: var(--text-color);
            color: var(--bg-color);
            border: none;
            padding: 12px 22px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            white-space: nowrap;
        }

        .menu-btn:hover {
            background-color: #333;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #f4f0eb;
            min-width: 300px;
            box-shadow: 0px 8px 20px rgba(0,0,0,0.2);
            padding: 15px;
            border: 1px solid #c8bfc0;
            border-radius: 4px;
        }

        .dropdown-content.show {
            display: block;
        }

        .search-input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #b5aba0;
            background: #fff;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            margin-bottom: 10px;
            border-radius: 3px;
            outline: none;
        }

        .suggestions-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 220px;
            overflow-y: auto;
        }

        .suggestions-list li {
            padding: 8px 10px;
            cursor: pointer;
            font-size: 0.85rem;
            border-bottom: 1px solid #e2dbd2;
            transition: background 0.2s;
        }

        .suggestions-list li:hover {
            background-color: #e2dbd2;
        }

        .room {
            position: relative;
            width: 3400px; 
            height: 1400px;
            margin-top: 0px;
        }

        .main-table {
            position: absolute;
            border: 3px solid #1a1a1a;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: 1px;
            z-index: 2;
        }

        .table-vert {
            position: absolute;
            border: 3px solid #1a1a1a;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 15px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.2rem;
            font-weight: 600;
            z-index: 2;
        }

        .seat {
            position: absolute;
            width: 190px; 
            height: 32px;
            background-color: var(--seat-color);
            color: #000; 
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.78rem; 
            font-weight: 600;
            text-align: center;
            padding: 2px 6px;
            cursor: pointer;
            transition: all 0.25s ease;
            z-index: 3;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transform: translate(-50%, -50%);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.1;
        }

        .seat.seat-top {
            width: 110px; 
            height: 40px; 
            font-size: 0.65rem; 
            white-space: normal;
            word-break: break-word;
        }

        .seat:hover {
            transform: translate(-50%, -50%) scale(1.1);
            z-index: 20;
        }

        .seat.highlight {
            background-color: var(--accent-green) !important;
            transform: translate(-50%, -50%) scale(1.18);
            box-shadow: 0 0 15px rgba(75, 107, 84, 0.9);
            z-index: 20;
        }
    </style>
</head>

        function renderSeats() {
            const container = document.getElementById("seatsContainer");
            container.innerHTML = "";

            let tableCounters = {
                "Stół I": { left: 0, right: 0 },
                "Stół II": { left: 0, right: 0 },
                "Stół III": { left: 0, right: 0 },
                "Stół IV": { left: 0, right: 0 },
                "Stół V": { left: 0, right: 0 }
            };

            let presTopCount = 0;
            let presLeftCount = 0;
            let presRightCount = 0;

            const seatHeight = 32; 
            const gap = 10;
            const step = seatHeight + gap;

            const totalPresSeats = 10;
            
            const tableIWidth = 70;
            const tableIIWidth = 70;
            const tableIIIWidth = 70;
            const tableIVWidth = 70;
            const tableVWidth = 70;

            const gap12 = 450;
            const gap23 = 450;
            const gap34 = 450;
            const gap45 = 450;

            const localTableI = 0;
            const localTableII = localTableI + tableIWidth + gap12;
            const localTableIII = localTableII + tableIIWidth + gap23;
            const localTableIV = localTableIII + tableIIIWidth + gap34;
            const localTableV = localTableIV + tableIVWidth + gap45;

            const totalTablesWidth = (localTableV + tableVWidth) - localTableI;

            const roomWidth = 3400; 
            const offsetX = (roomWidth - totalTablesWidth) / 2;

            const tableILeft = offsetX + localTableI;
            const tableIILeft = offsetX + localTableII;
            const tableIIILeft = offsetX + localTableIII;
            const tableIVLeft = offsetX + localTableIV;
            const tableVLeft = offsetX + localTableV;

            const mainTableLeft = tableIILeft;
            const targetRightEdge = tableIVLeft + tableIVWidth;
            const finalMainTableWidth = targetRightEdge - mainTableLeft;

            const renderedSeats = guestsData.map((g, index) => {
                let x = 0, y = 0;

                if (g.tableName === "Stół Prezydialny") {
                    if (g.side === "top") {
                        presTopCount++;
                        const topSeatWidth = 110;
                        const topSeatHeight = 40;
                        const stepTop = (finalMainTableWidth - topSeatWidth) / (totalPresSeats - 1);
                        
                        x = mainTableLeft + (topSeatWidth / 2) + ((presTopCount - 1) * stepTop);
                        y = 60 - 10 - (topSeatHeight / 2); 
                    } else if (g.side === "left") {
                        presLeftCount++;
                        x = mainTableLeft - 10 - (190 / 2);
                        y = 80 + ((presLeftCount - 1) * 40);
                    } else if (g.side === "right") {
                        presRightCount++;
                        x = mainTableLeft + finalMainTableWidth + 10 + (190 / 2);
                        y = 80 + ((presRightCount - 1) * 40);
                    }
                } else {
                    let tableLeft = tableILeft;
                    let startY = 185;

                    if (g.tableName === "Stół I") { tableLeft = tableILeft; startY = 185; }
                    if (g.tableName === "Stół II") { tableLeft = tableIILeft; startY = 176; }
                    if (g.tableName === "Stół III") { tableLeft = tableIIILeft; startY = 176; }
                    if (g.tableName === "Stół IV") { tableLeft = tableIVLeft; startY = 176; }
                    if (g.tableName === "Stół V") { tableLeft = tableVLeft; startY = 185; }

                    if (g.side === "left") {
                        tableCounters[g.tableName].left++;
                        const idx = tableCounters[g.tableName].left;
                        x = tableLeft - 105; 
                        y = startY + ((idx - 1) * step);
                    } else {
                        tableCounters[g.tableName].right++;
                        const idx = tableCounters[g.tableName].right;
                        x = tableLeft + 70 + 105; 
                        y = startY + ((idx - 1) * step);
                    }
                }

                return { ...g, seatIndex: index + 1, x, y };
            });

            const mainTableElem = document.getElementById("mainTable");
            if (mainTableElem) {
                mainTableElem.style.left = `${mainTableLeft}px`;
                mainTableElem.style.width = `${finalMainTableWidth}px`;
            }

            let tableLimits = {
                "Stół I": { top: 149, left: tableILeft, maxY: 0 },
                "Stół II": { top: 140, left: tableIILeft, maxY: 0 },
                "Stół III": { top: 140, left: tableIIILeft, maxY: 0 },
                "Stół IV": { top: 140, left: tableIVLeft, maxY: 0 },
                "Stół V": { top: 149, left: tableVLeft, maxY: 0 }
            };

            renderedSeats.forEach(g => {
                if (g.tableName !== "Stół Prezydialny") {
                    if (g.y > tableLimits[g.tableName].maxY) {
                        tableLimits[g.tableName].maxY = g.y;
                    }
                }
            });

            for (let tName in tableLimits) {
                let elId = "";
                if (tName === "Stół I") elId = "tableI";
                if (tName === "Stół II") elId = "tableII";
                if (tName === "Stół III") elId = "tableIII";
                if (tName === "Stół IV") elId = "tableIV";
                if (tName === "Stół V") elId = "tableV";

                const tElem = document.getElementById(elId);
                if (tElem) {
                    tElem.style.top = `${tableLimits[tName].top}px`;
                    tElem.style.left = `${tableLimits[tName].left}px`;
                    const tableHeight = (tableLimits[tName].maxY + seatHeight + gap) - tableLimits[tName].top;
                    tElem.style.height = `${tableHeight}px`;
                }
            }

            const tableIIIHeight = (tableLimits["Stół III"].maxY + seatHeight + gap) - tableLimits["Stół III"].top;
            const tableIIIBottom = tableLimits["Stół III"].top + tableIIIHeight;
            const menuContainer = document.getElementById("menuContainer");
            if (menuContainer) {
                menuContainer.style.left = `${tableIIILeft + (tableIIIWidth / 2)}px`;
                menuContainer.style.top = `${tableIIIBottom + 200}px`;
            }

            renderedSeats.forEach(g => {
                const seat = document.createElement("div");
                seat.className = "seat";
                if (g.tableName === "Stół Prezydialny" && g.side === "top") {
                    seat.classList.add("seat-top");
                }
                seat.dataset.id = g.id;
                seat.innerText = g.name;
                seat.onclick = () => selectSeat(g.id);

                seat.style.left = `${g.x}px`;
                seat.style.top = `${g.y}px`;
                container.appendChild(seat);
            });
        }

        function toggleMenu() {
            document.getElementById("searchDropdown").classList.toggle("show");
            if(document.getElementById("searchDropdown").classList.contains("show")) {
                document.getElementById("searchInput").focus();
            }
        }

        window.onclick = function(event) {
            if (!event.target.matches('.menu-btn') && !event.target.closest('.dropdown-content')) {
                var dropdowns = document.getElementsByClassName("dropdown-content");
                for (var i = 0; i < dropdowns.length; i++) {
                    var openDropdown = dropdowns[i];
                    if (openDropdown.classList.contains('show')) {
                        openDropdown.classList.remove('show');
                    }
                }
            }
        }

        function filterGuests() {
            const input = document.getElementById("searchInput").value.toLowerCase();
            const listContainer = document.getElementById("suggestionsList");
            listContainer.innerHTML = "";

            if (input.trim() === "") return;

            const filtered = guestsData.filter(g => g.name.toLowerCase().includes(input));

            filtered.forEach(guest => {
                const li = document.createElement("li");
                // Zmiana tutaj: sprawdzamy, czy gość ma ustawione searchTable, jak nie to używamy tableName
                const tableNameToDisplay = guest.searchTable || guest.tableName; 
                li.textContent = `${guest.name} (${tableNameToDisplay})`;
                li.onclick = function() {
                    document.getElementById("searchInput").value = guest.name;
                    highlightSeat(guest.id);
                    listContainer.innerHTML = "";
                    document.getElementById("searchDropdown").classList.remove('show');
                };
                listContainer.appendChild(li);
            });
        }

        function highlightSeat(id) {
            const seats = document.querySelectorAll('.seat');
            seats.forEach(s => s.classList.remove('highlight'));

            const targetSeat = document.querySelector(`.seat[data-id="${id}"]`);
            if (targetSeat) {
                targetSeat.classList.add('highlight');
                targetSeat.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
                
                setTimeout(() => {
                    targetSeat.classList.remove('highlight');
                }, 4000);
            }
        }

        function selectSeat(id) {
            highlightSeat(id);
        }

        window.onload = function() {
            renderSeats();
            
            const roomWidth = 3400;
            const scrollX = (roomWidth - window.innerWidth) / 2;
            window.scrollTo({ left: scrollX > 0 ? scrollX : 0, top: 0, behavior: 'instant' });
        };
    </script>
</body>
</html>
